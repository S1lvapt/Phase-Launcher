[package]
name = "launcher"
version = "0.1.0"
description = "Advanced launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
sha2 = "0.10.8"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-os = "2"
log = "0.4"
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Foundation",
] }
winapi = { version = "0.3", features = ["tlhelp32", "shellapi", "winbase", "errhandlingapi"] }
sysinfo = "0.29.10"
rayon = "1.10.0"
tokio = { version = "1.28.2", features = ["full"] }
reqwest = { version = "0.11.18", features = ["blocking", "stream", "json"] }
futures-util = "0.3"
flate2 = "1.0.25"
declarative-discord-rich-presence = { git = "https://github.com/KPidS/declarative-discord-rich-presence" }
indicatif = "0.17.3"
tauri-plugin-http = "2.0"
tauri-plugin-notification = "2"
widestring = "1.2.1"
once_cell = "1.21.3"
unrar = "0.5.8"
zip = "7.4.0"

[package.metadata.windows]
requested-execution-level = "asInvoker"
